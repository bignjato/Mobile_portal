<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTS Admin Portal – EKO-FLOR PLUS</title>
<style>
  :root { --red:#EF0C0C;--dark:#242930;--grey:#7B8287;--bg:#F1F5F9;--card:#fff;--border:#E2E8F0;--green:#16A34A;--amber:#D97706;--blue:#2563EB; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--dark);}
  .topbar{background:var(--dark);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .topbar-logo{font-size:16px;font-weight:800;}.topbar-logo span{color:var(--red);}
  .topbar-right{font-size:13px;color:#94A3B8;}
  .main{max-width:1280px;margin:0 auto;padding:24px 16px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
  .stat-card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);}
  .stat-value{font-size:28px;font-weight:800;}.stat-label{font-size:12px;color:var(--grey);margin-top:4px;}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .toolbar input,.toolbar select{padding:9px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:white;}
  .toolbar input{flex:1;min-width:180px;}
  .btn{padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;}
  .btn-red{background:var(--red);color:#fff;}.btn-dark{background:var(--dark);color:#fff;}.btn-outline{background:white;border:1.5px solid var(--border);color:var(--dark);}
  .btn:hover{opacity:.88;}
  table{width:100%;background:var(--card);border-radius:12px;border-collapse:collapse;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  th{background:var(--dark);color:#fff;text-align:left;padding:12px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  td{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;} tr:hover td{background:#F8FAFC;cursor:pointer;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .b-planiran{background:#EFF6FF;color:var(--blue);}.b-na_lokaciji{background:#FFFBEB;color:var(--amber);}.b-potpisan{background:#F0FDF4;color:var(--green);}.b-nepravilnost{background:#FEF2F2;color:var(--red);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:white;border-radius:16px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;}
  .modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:1;}
  .modal-title{font-size:17px;font-weight:800;}
  .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--grey);}
  .modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-label{font-size:12px;font-weight:600;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;}
  .form-input{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;width:100%;}
  .form-input:focus{outline:none;border-color:var(--red);}
  select.form-input{background:white;}
  .sec-title{font-size:12px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-top:4px;}
  .st{width:100%;border-collapse:collapse;font-size:13px;}
  .st th{background:#F8FAFC;padding:8px;text-align:left;font-size:11px;color:var(--grey);font-weight:600;}
  .st td{padding:6px 8px;border-top:1px solid var(--border);}
  .st input{width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:13px;}
  .dr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:14px;}
  .dl{color:var(--grey);font-size:12px;} .dv{font-weight:600;text-align:right;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;z-index:999;}
  .potpis-img{max-width:100%;border:1px solid var(--border);border-radius:8px;margin-top:8px;}
  @media(max-width:600px){.form-row{grid-template-columns:1fr;} th:nth-child(3),td:nth-child(3),th:nth-child(5),td:nth-child(5){display:none;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">EKO-FLOR <span>PLUS</span> · VTS Admin</div>
  <div class="topbar-right" id="topbar-datum"></div>
</div>
<div class="main">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍  Pretraži partnera, broj RN..." oninput="renderTable()">
    <input type="date" id="filter-datum" onchange="renderTable()">
    <select id="filter-status" onchange="renderTable()">
      <option value="">Svi statusi</option>
      <option value="PLANIRAN">Planirani</option>
      <option value="NA_LOKACIJI">Na lokaciji</option>
      <option value="POTPISAN">Potpisani</option>
      <option value="NEPRAVILNOST">Nepravilnosti</option>
    </select>
    <select id="filter-vozilo" onchange="renderTable()"><option value="">Sva vozila</option></select>
    <button class="btn btn-red" onclick="openNewModal()">+ Novi RN</button>
    <button class="btn btn-outline" onclick="loadData()">↻ Osvježi</button>
  </div>
  <table>
    <thead><tr><th>Broj RN</th><th>Partner / Lokacija</th><th>Datum</th><th>Vozilo / Vozač</th><th>Stavke</th><th>Status</th><th></th></tr></thead>
    <tbody id="rn-tbody"></tbody>
  </table>
</div>

<!-- MODAL: Uredi/Novi -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modal-title">Novi RN</div><button class="modal-close" onclick="closeModal('modal-edit')">✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Broj RN</label><input class="form-input" id="f-brRN" placeholder="26049001"></div>
        <div class="form-group"><label class="form-label">Interni broj</label><input class="form-input" id="f-intBr" placeholder="2501/01"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Datum usluge</label><input class="form-input" id="f-datum" type="date"></div>
        <div class="form-group"><label class="form-label">Vozilo</label><select class="form-input" id="f-vozilo"></select></div>
      </div>
      <div class="sec-title">Partner</div>
      <div class="form-group"><label class="form-label">Naziv</label><input class="form-input" id="f-pn" placeholder="Naziv tvrtke"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Adresa</label><input class="form-input" id="f-pa" placeholder="Ulica i broj"></div>
        <div class="form-group"><label class="form-label">Mjesto</label><input class="form-input" id="f-pm" placeholder="Grad"></div>
      </div>
      <div class="form-group"><label class="form-label">OIB</label><input class="form-input" id="f-po" placeholder="11 znamenki"></div>
      <div class="sec-title">Lokacija preuzimanja</div>
      <div class="form-group"><label class="form-label">Naziv lokacije</label><input class="form-input" id="f-ln" placeholder="Isto kao partner ili drugačije"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Adresa</label><input class="form-input" id="f-la" placeholder="Ulica i broj"></div>
        <div class="form-group"><label class="form-label">Mjesto</label><input class="form-input" id="f-lm" placeholder="Grad"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">GPS Latitude</label><input class="form-input" id="f-lat" placeholder="45.8150" type="number" step="0.0001"></div>
        <div class="form-group"><label class="form-label">GPS Longitude</label><input class="form-input" id="f-lng" placeholder="15.9819" type="number" step="0.0001"></div>
      </div>
      <div class="sec-title">Stavke</div>
      <table class="st"><thead><tr><th>#</th><th>Šifra</th><th>Naziv robe</th><th>Kol.</th><th>JM</th><th></th></tr></thead><tbody id="stavke-tbody"></tbody></table>
      <button class="btn btn-outline" onclick="addStavka()" style="margin-top:8px;font-size:13px;">+ Dodaj stavku</button>
      <div class="form-group"><label class="form-label">Napomena</label><input class="form-input" id="f-nap" placeholder="Opcionalna napomena vozaču"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-edit')">Odustani</button>
      <button class="btn btn-red" onclick="saveRN()">💾 Spremi</button>
    </div>
  </div>
</div>

<!-- MODAL: Detalji -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="detail-title">Detalji</div><button class="modal-close" onclick="closeModal('modal-detail')">✕</button></div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-detail')">Zatvori</button>
      <button class="btn btn-dark" id="d-edit">✏️ Uredi</button>
      <button class="btn btn-red" id="d-del">🗑 Obriši</button>
    </div>
  </div>
</div>

<script>
const API='http://localhost:4000/v1';
let D={radniNalozi:[],vozila:[],vozaci:[]};
let editId=null,sc=0;

async function loadData(){
  try {
    const [rn,v,d]=await Promise.all([
      fetch(API+'/radni-nalozi').then(r=>r.json()),
      fetch(API+'/vozila').then(r=>r.json()),
      fetch(API+'/vozaci').then(r=>r.json()),
    ]);
    D={radniNalozi:rn,vozila:v,vozaci:d};
    fillFilters();renderStats();renderTable();
  } catch(e){ toast('❌ API nije dostupan'); }
}

function fillFilters(){
  ['filter-vozilo','f-vozilo'].forEach(id=>{
    const s=document.getElementById(id);
    const base=id==='filter-vozilo'?'<option value="">Sva vozila</option>':'<option value="">— odaberi —</option>';
    s.innerHTML=base+D.vozila.map(v=>`<option value="${v.id}">${v.registracija} – ${v.naziv}</option>`).join('');
  });
}

const gV=id=>D.vozila.find(v=>v.id===id)||{};
const gD=id=>D.vozaci.find(d=>d.id===id)||{};

function badge(s){
  const m={PLANIRAN:['b-planiran','🔵 Planiran'],NA_LOKACIJI:['b-na_lokaciji','🟡 Na lokaciji'],POTPISAN:['b-potpisan','🟢 Potpisan'],NEPRAVILNOST:['b-nepravilnost','🔴 Nepravilnost']};
  const[c,l]=m[s]||['',''];
  return `<span class="badge ${c}">${l}</span>`;
}

function renderStats(){
  const r=D.radniNalozi,t=new Date().toISOString().split('T')[0];
  const s=[
    {l:'Ukupno RN',v:r.length,c:'#2563EB'},{l:'Danas',v:r.filter(x=>x.datumUsluge===t).length,c:'#0891B2'},
    {l:'Planirani',v:r.filter(x=>x.status==='PLANIRAN').length,c:'#2563EB'},
    {l:'Na lokaciji',v:r.filter(x=>x.status==='NA_LOKACIJI').length,c:'#D97706'},
    {l:'Potpisani',v:r.filter(x=>x.status==='POTPISAN').length,c:'#16A34A'},
    {l:'Nepravilnosti',v:r.filter(x=>x.status==='NEPRAVILNOST').length,c:'#EF0C0C'},
  ];
  document.getElementById('stats').innerHTML=s.map(x=>`<div class="stat-card"><div class="stat-value" style="color:${x.c}">${x.v}</div><div class="stat-label">${x.l}</div></div>`).join('');
}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const fd=document.getElementById('filter-datum').value;
  const fs=document.getElementById('filter-status').value;
  const fv=document.getElementById('filter-vozilo').value;
  let rows=D.radniNalozi.filter(rn=>{
    const v=gV(rn.voziloId),d=gD(rn.vozacId);
    const txt=[rn.brojRN,rn.partner?.naziv,rn.lokacija?.adresa,d.ime,d.prezime,v.registracija].join(' ').toLowerCase();
    if(q&&!txt.includes(q))return false;
    if(fd&&rn.datumUsluge!==fd)return false;
    if(fs&&rn.status!==fs)return false;
    if(fv&&rn.voziloId!==fv)return false;
    return true;
  });
  rows.sort((a,b)=>{
    if(b.datumUsluge!==a.datumUsluge)return b.datumUsluge.localeCompare(a.datumUsluge);
    const o={NA_LOKACIJI:0,PLANIRAN:1,NEPRAVILNOST:2,POTPISAN:3};
    return(o[a.status]??9)-(o[b.status]??9);
  });
  const tb=document.getElementById('rn-tbody');
  if(!rows.length){tb.innerHTML=`<tr><td colspan="7" style="text-align:center;color:#94A3B8;padding:32px;">Nema radnih naloga</td></tr>`;return;}
  tb.innerHTML=rows.map(rn=>{
    const v=gV(rn.voziloId),d=gD(rn.vozacId);
    const st=rn.stavke?.map(s=>s.nazivRobe.split(' ').slice(0,3).join(' ')).join(', ')||'—';
    return`<tr onclick="openDetail('${rn.id}')">
      <td><strong>${rn.brojRN}</strong><br><span style="font-size:11px;color:#94A3B8">${rn.interniBroj||''}</span></td>
      <td><strong>${rn.partner?.naziv||'—'}</strong><br><span style="font-size:12px;color:#64748B">${rn.lokacija?.adresa||''}, ${rn.lokacija?.mjesto||''}</span></td>
      <td>${rn.datumUsluge||'—'}</td>
      <td><strong>${v.registracija||'—'}</strong><br><span style="font-size:12px;color:#64748B">${d.ime||''} ${d.prezime||''}</span></td>
      <td style="font-size:12px;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" title="${st}">${st}</td>
      <td>${badge(rn.status)}</td>
      <td><button class="btn btn-outline" style="font-size:12px;padding:5px 10px" onclick="event.stopPropagation();openEditModal('${rn.id}')">✏️</button></td>
    </tr>`;
  }).join('');
}

function openDetail(id){
  const rn=D.radniNalozi.find(r=>r.id===id);if(!rn)return;
  const v=gV(rn.voziloId),d=gD(rn.vozacId);
  document.getElementById('detail-title').textContent=`RN ${rn.brojRN}`;
  document.getElementById('d-edit').onclick=()=>{closeModal('modal-detail');openEditModal(id);};
  document.getElementById('d-del').onclick=()=>delRN(id);
  let h=`
    <div class="sec-title" style="margin-top:0">Osnovni podaci</div>
    <div class="dr"><span class="dl">Broj RN</span><span class="dv">${rn.brojRN}</span></div>
    <div class="dr"><span class="dl">Interni broj</span><span class="dv">${rn.interniBroj||'—'}</span></div>
    <div class="dr"><span class="dl">Datum usluge</span><span class="dv">${rn.datumUsluge}</span></div>
    <div class="dr"><span class="dl">Status</span><span class="dv">${badge(rn.status)}</span></div>
    <div class="dr"><span class="dl">Vozilo</span><span class="dv">${v.registracija||'—'}</span></div>
    <div class="dr"><span class="dl">Vozač</span><span class="dv">${d.ime||''} ${d.prezime||''}</span></div>
    <div class="sec-title">Partner</div>
    <div class="dr"><span class="dl">Naziv</span><span class="dv">${rn.partner?.naziv||'—'}</span></div>
    <div class="dr"><span class="dl">Adresa</span><span class="dv">${rn.partner?.adresa||''}, ${rn.partner?.mjesto||''}</span></div>
    <div class="dr"><span class="dl">OIB</span><span class="dv">${rn.partner?.oib||'—'}</span></div>
    <div class="sec-title">Lokacija</div>
    <div class="dr"><span class="dl">Naziv</span><span class="dv">${rn.lokacija?.naziv||'—'}</span></div>
    <div class="dr"><span class="dl">Adresa</span><span class="dv">${rn.lokacija?.adresa||''}, ${rn.lokacija?.mjesto||''}</span></div>
    <div class="dr"><span class="dl">GPS</span><span class="dv"><a href="https://maps.google.com/?q=${rn.lokacija?.lat},${rn.lokacija?.lng}" target="_blank" style="color:var(--blue)">${rn.lokacija?.lat||'—'}, ${rn.lokacija?.lng||'—'}</a></span></div>
    <div class="sec-title">Stavke</div>
    <table class="st" style="margin-bottom:12px">
      <thead><tr><th>#</th><th>Šifra</th><th>Naziv robe</th><th>Tip spr.</th><th>Kol.</th><th>JM</th></tr></thead>
      <tbody>${(rn.stavke||[]).map(s=>`<tr><td>${s.rbr}</td><td>${s.sifraArtikla}</td><td>${s.nazivRobe}</td><td>${s.tipSpremnika||'—'}</td><td><strong>${s.kolicina}</strong></td><td>${s.jedMjere}</td></tr>`).join('')}</tbody>
    </table>`;
  if(rn.napomena)h+=`<div class="dr"><span class="dl">Napomena</span><span class="dv">${rn.napomena}</span></div>`;
  if(rn.vrijemeDolaska)h+=`<div class="dr"><span class="dl">Dolazak</span><span class="dv">${new Date(rn.vrijemeDolaska).toLocaleString('hr')}</span></div>`;
  if(rn.gpsDolazak)h+=`<div class="dr"><span class="dl">GPS dolazak</span><span class="dv">${rn.gpsDolazak}</span></div>`;
  if(rn.potpisPartner)h+=`<div class="dr"><span class="dl">Potpisao</span><span class="dv">${rn.potpisPartner}</span></div>`;
  if(rn.potpis)h+=`<div class="sec-title" style="margin-top:12px">Potpis</div><img class="potpis-img" src="${rn.potpis}">`;
  document.getElementById('detail-body').innerHTML=h;
  document.getElementById('modal-detail').classList.add('open');
}

function openNewModal(){
  editId=null;
  document.getElementById('modal-title').textContent='Novi radni nalog';
  ['f-brRN','f-intBr','f-pn','f-pa','f-pm','f-po','f-ln','f-la','f-lm','f-lat','f-lng','f-nap'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-datum').value=new Date().toISOString().split('T')[0];
  document.getElementById('f-vozilo').value='';
  document.getElementById('stavke-tbody').innerHTML='';
  addStavka();
  document.getElementById('modal-edit').classList.add('open');
}

function openEditModal(id){
  const rn=D.radniNalozi.find(r=>r.id===id);if(!rn)return;
  editId=id;
  document.getElementById('modal-title').textContent=`Uredi RN ${rn.brojRN}`;
  document.getElementById('f-brRN').value=rn.brojRN||'';
  document.getElementById('f-intBr').value=rn.interniBroj||'';
  document.getElementById('f-datum').value=rn.datumUsluge||'';
  document.getElementById('f-vozilo').value=rn.voziloId||'';
  document.getElementById('f-pn').value=rn.partner?.naziv||'';
  document.getElementById('f-pa').value=rn.partner?.adresa||'';
  document.getElementById('f-pm').value=rn.partner?.mjesto||'';
  document.getElementById('f-po').value=rn.partner?.oib||'';
  document.getElementById('f-ln').value=rn.lokacija?.naziv||'';
  document.getElementById('f-la').value=rn.lokacija?.adresa||'';
  document.getElementById('f-lm').value=rn.lokacija?.mjesto||'';
  document.getElementById('f-lat').value=rn.lokacija?.lat||'';
  document.getElementById('f-lng').value=rn.lokacija?.lng||'';
  document.getElementById('f-nap').value=rn.napomena||'';
  document.getElementById('stavke-tbody').innerHTML='';
  (rn.stavke||[]).forEach(s=>addStavka(s));
  document.getElementById('modal-edit').classList.add('open');
}

function addStavka(s={}){
  const i=sc++;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${i+1}</td>
    <td><input class="ss" value="${s.sifraArtikla||''}" placeholder="R115001"></td>
    <td><input class="sn" value="${s.nazivRobe||''}" placeholder="Naziv robe" style="min-width:140px"></td>
    <td><input class="sk" value="${s.kolicina||''}" placeholder="0" type="number" style="width:70px"></td>
    <td><input class="sj" value="${s.jedMjere||'kg'}" placeholder="kg" style="width:50px"></td>
    <td><button onclick="this.closest('tr').remove()" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:16px">✕</button></td>`;
  document.getElementById('stavke-tbody').appendChild(tr);
}

async function saveRN(){
  const br=document.getElementById('f-brRN').value.trim();
  if(!br){toast('⚠ Unesite broj RN');return;}
  const stavke=Array.from(document.querySelectorAll('#stavke-tbody tr')).map((tr,i)=>({
    rbr:i+1,
    sifraArtikla:tr.querySelector('.ss').value.trim(),
    nazivRobe:tr.querySelector('.sn').value.trim(),
    tipSpremnika:'',
    kolicina:parseFloat(tr.querySelector('.sk').value)||0,
    jedMjere:tr.querySelector('.sj').value.trim()||'kg',
  })).filter(s=>s.sifraArtikla||s.nazivRobe);
  const body={
    brojRN:br,interniBroj:document.getElementById('f-intBr').value.trim(),
    datumUsluge:document.getElementById('f-datum').value,
    voziloId:document.getElementById('f-vozilo').value,
    partner:{naziv:document.getElementById('f-pn').value.trim(),adresa:document.getElementById('f-pa').value.trim(),mjesto:document.getElementById('f-pm').value.trim(),oib:document.getElementById('f-po').value.trim()},
    lokacija:{naziv:document.getElementById('f-ln').value.trim()||document.getElementById('f-pn').value.trim(),adresa:document.getElementById('f-la').value.trim()||document.getElementById('f-pa').value.trim(),mjesto:document.getElementById('f-lm').value.trim()||document.getElementById('f-pm').value.trim(),lat:parseFloat(document.getElementById('f-lat').value)||45.815,lng:parseFloat(document.getElementById('f-lng').value)||15.982},
    stavke,napomena:document.getElementById('f-nap').value.trim(),
  };
  try{
    if(editId){await fetch(`${API}/radni-nalozi/${editId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('✅ RN ažuriran');}
    else{await fetch(`${API}/radni-nalozi`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('✅ Novi RN kreiran');}
    closeModal('modal-edit');loadData();
  }catch(e){toast('❌ Greška pri spremanju');}
}

async function delRN(id){
  if(!confirm('Obrisati ovaj radni nalog?'))return;
  await fetch(`${API}/radni-nalozi/${id}`,{method:'DELETE'});
  toast('🗑 RN obrisan');closeModal('modal-detail');loadData();
}

function closeModal(id){document.getElementById(id).classList.remove('open');}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}

document.getElementById('topbar-datum').textContent=new Date().toLocaleDateString('hr-HR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('filter-datum').value=new Date().toISOString().split('T')[0];
loadData();
</script>
</body>
</html>
